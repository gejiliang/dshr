packages:
  - 'packages/*'
# ── 下面这一大块是 `pnpm install` 自动加的，别手删 ────────────────────────────
#
# pnpm 11 默认有「最短发布年龄」防护（`minimumReleaseAge`，默认 24 小时）：
# 刚发布不久的包一律拒装，挡的是「上游被投毒后几小时内抢装」这类供应链攻击。
#
# dshr 钉的 dsh 是 `next` 线（见 docs/dsh-contract.md 第九节），**经常比这个窗口还新**：
# `0.1.0-rc.8` 发布于 2026-08-19T15:41Z，装它的时候还不到一天，于是整批被拦下来。
#
# 保留这份**逐个列名的豁免**，不要改成把 `minimumReleaseAge` 关掉——
# 关掉是对所有依赖失去防护，列名只是对这一批已经人工过目的包开口子。
# 升级 dsh 时这份列表会跟着 `pnpm install` 一起变，照单提交即可。
