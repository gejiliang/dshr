# The @dshr/bundle patch: the terminal surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# Unlike dsh-web-app, this surface KEEPS the base agent plane mounted. The
# upstream web patch says why the base carries it at all: "The base keeps them
# for the TUI, which is single-session and composes its agent process-wide;
# the Web surface disables them here and lets each session mount a preset
# instead." So the web patch's `disabled: true` block is deliberately NOT
# mirrored here; only the browser half of the web roster (modules / connection
# / client-* / ui-* / client-hmr / web-runtime) is cut. The host rows below
# are the same ones the Web surface mounts.

# The deployment persona: the same coding-agent persona both shipped surfaces
# (web, headless) state over the base row's empty default.
- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off, as on both shipped surfaces;
# the launcher's watch-only fallback still keeps the user patch layers live.
- id: hmr
  disabled: true

# Same temporary process-wide Code Mode opt-in as the shipped surfaces:
# DSH_TOOLS_MODE (native|code|both) opts the whole process into Code Mode;
# unset keeps the schema default (native).
- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# ── host rows: the same server plane the Web surface mounts ─────────────────

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # ⚠️ 下面这五行是 2026-08-18 补的：**光靠 `--dump-config` 发现不了它们缺**。
    # 组合阶段不检查服务依赖，图 dump 得干干净净，一真启动就炸：
    #   `@deepseek-ai/dsh-host-apiproxy: pending (waiting for service: directoryPicker)`
    # 判据是 dsh 自己的 `dsh-web-app/cordis.patch.yml`——host 侧要哪些行以它为准。
    # **改这份 patch 之后必须真 boot 一次，不能只 dump。**

    # api-gateway 注入 directoryPicker（抽象服务，必须挂一个具体实现）。
    #
    # ⚠️ **这里不能照抄 web 的 `-auto`**。实测：`-auto` 自己 `waiting for service: webServer`
    # ——它靠 bind host / SSH / display 去自选 native 还是 browse，而 dshr 刻意不挂 webserver。
    # 照抄上游会让整棵树起不来。
    #
    # `-browse` 才是终端该用的：不需要 web server，把目录列表交给客户端画
    # （对应 `host.listDirectory` 那一族 RPC）。`-native` 会弹 GUI 目录对话框，
    # 对跑在 herdr pane 里的终端 surface 是错的。
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    # 预设名册。**没有这行 `agentPreset.list` / `select` 就没得用**——
    # dshr 的切预设（tab 就地循环 + 面板项）直接失效。
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # 当前 Loader 条目的只读投影，给受信任的 client RPC 用。
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # The API gateway: the transport-agnostic dispatch face every client shape
    # shares. The base layer's agent-default-model service owns the default model.
    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Ordinary provider for the parsed dshr flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    # `--help` (and rejected invocations) provide nothing, so the row below
    # stays pending and no runtime is published.
    - id: dshr-startup
      name: '@dshr/bundle/startup'

    # The app plugin: provides dshrRuntime from these flag-resolved values and
    # owns the surface seam (startSurface). No webserver row here on purpose:
    # the default shape is one process with no port and no trust-fence
    # question; a future `server` mode inserts the webserver row as an overlay.
    - id: dshr-app
      name: '@dshr/bundle'
      inject: [dshrStartup]
      config:
        host: !!js ctx.dshrStartup.host ?? '127.0.0.1'
        port: !!js ctx.dshrStartup.port ?? 39080
        connect: !!js ctx.dshrStartup.connect
        resume: !!js ctx.dshrStartup.resume
